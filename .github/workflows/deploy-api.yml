name: Deploy API to Yandex Cloud
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**']
permissions:
  contents: read
concurrency: deploy-api
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd server && npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install yc CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yc" -n
          echo "$HOME/yc/bin" >> "$GITHUB_PATH"
      - run: cd server && npm install --no-audit --no-fund
      - name: Deploy
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: cd server && ./deploy/setup.sh
