<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Звездочёт — онлайн-школа для детей</title>
<meta name="description" content="Звездочёт: математика, китайский и английский в одном месте. Ребёнок занимается, а на звёздной карте загораются новые звёзды.">
<meta property="og:title" content="Звездочёт — онлайн-школа для детей">
<meta property="og:description" content="Математика, китайский и английский. Каждый урок зажигает звезду на карте ученика.">
<meta property="og:image" content="https://aleksarulezzz.ru/learning/og.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1b1446">
<link rel="canonical" href="https://aleksarulezzz.ru/learning/">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f0ff; --bg2:#e9f3ff;
  --card:rgba(255,255,255,.78); --card-solid:#fff; --line:rgba(87,70,180,.12);
  --ink:#231a52; --muted:#6f6a90; --soft:#a49fc4;
  --violet:#7b5cff; --violet2:#a98bff; --night:#1b1446; --night2:#2d2170;
  --math:#2fa4ff; --math2:#7fd3ff; --math-bg:#e5f4ff;
  --zh:#ff6a5b; --zh2:#ffb36b; --zh-bg:#fff0ea;
  --en:#22c08a; --en2:#9be7b5; --en-bg:#e6faf1;
  --gold:#ffbf2f; --ok:#22c08a; --bad:#ff5b6e;
  --r:24px; --shadow:0 10px 30px rgba(60,40,160,.10),0 2px 6px rgba(60,40,160,.06);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
  background:radial-gradient(1200px 600px at 10% -10%,#e2d9ff 0,transparent 60%),radial-gradient(900px 500px at 110% 10%,#d7ecff 0,transparent 60%),var(--bg);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3,p{margin:0}
.hidden{display:none!important}

/* ===== layout ===== */
.app{display:grid;grid-template-columns:88px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px;
  background:rgba(255,255,255,.55);backdrop-filter:blur(14px);border-right:1px solid var(--line)}
.logo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;margin-bottom:14px;
  background:linear-gradient(135deg,#8c6bff,#4e7bff);box-shadow:0 8px 20px rgba(110,80,255,.35)}
.logo svg{width:30px;height:30px}
.nav{display:flex;flex-direction:column;gap:6px;width:100%}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border-radius:16px;font-size:12px;font-weight:800;color:var(--muted);transition:.2s}
.nav button .ic{font-size:22px;line-height:1}
.nav button:hover{background:rgba(123,92,255,.08);color:var(--ink)}
.nav button.on{background:#fff;color:var(--violet);box-shadow:var(--shadow)}
.side .spacer{flex:1}
main{padding:22px 28px 40px;max-width:1280px;width:100%;margin:0 auto}

/* ===== top ===== */
.top{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.ava{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:38px;flex:none;
  background:linear-gradient(140deg,#fff,#efe8ff);box-shadow:0 0 0 4px #fff,0 8px 22px rgba(90,60,200,.2);cursor:pointer}
.hello h1{font-size:30px;font-weight:900;letter-spacing:-.4px}
.hello p{color:var(--muted);font-weight:700;margin-top:2px}
.top .grow{flex:1}
.pill{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:800}
.pill .n{font-size:18px}

/* ===== cards ===== */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;position:relative;overflow:hidden}
.card h3{font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted);font-weight:700}
.c-hero{grid-column:span 6;min-height:240px;color:#fff;padding:26px;background:linear-gradient(135deg,var(--night) 0%,var(--night2) 60%,#4a2fa8 100%);border:0}
.c-prog{grid-column:span 3}
.c-lvl{grid-column:span 3;background:linear-gradient(160deg,#efe9ff,#dccfff);border:0}
.c-subj{grid-column:span 4;cursor:pointer;transition:transform .2s,box-shadow .2s}
.c-subj:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(60,40,160,.16)}
.c-plan{grid-column:span 5}
.c-star{grid-column:span 3;background:linear-gradient(160deg,#241a5e,#3b2a8f);color:#fff;border:0}
.c-coll{grid-column:span 4}
.c-map{grid-column:span 7;background:linear-gradient(160deg,var(--night),#2a1f6b);color:#fff;border:0;cursor:pointer;min-height:230px}
.c-game{grid-column:span 5;background:linear-gradient(135deg,#2b2378,#5b3cc4);color:#fff;border:0}

/* hero banner */
.slides{position:relative;height:100%}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;opacity:0;transform:translateX(20px);transition:.5s;pointer-events:none}
.slide>:not(.hero-art){max-width:54%;position:relative}
.slide.on{opacity:1;transform:none;pointer-events:auto}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;opacity:.85}
.slide h2{font-size:34px;line-height:1.05;font-weight:900;letter-spacing:-.5px}
.slide p{opacity:.85;font-weight:700;font-size:15px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:900;background:#fff;color:var(--ink);box-shadow:0 6px 16px rgba(0,0,0,.15);transition:transform .15s;width:max-content}
.btn:hover{transform:scale(1.04)}
.btn.v{background:var(--violet);color:#fff}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:none}
.dots{position:absolute;bottom:0;left:0;display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer}
.dots i.on{background:#fff;width:22px;border-radius:5px}
.hero-art{position:absolute;right:-26px;top:-26px;bottom:-26px;width:46%;height:calc(100% + 52px);pointer-events:none}
.sky i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s infinite ease-in-out}
@keyframes tw{50%{opacity:.2}}

/* progress ring */
.ringrow{display:flex;align-items:center;gap:14px;margin-top:14px}
.ring{width:104px;height:104px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:900}
.streak{margin-top:14px;padding:12px 14px;border-radius:16px;background:linear-gradient(90deg,#fff3dc,#ffe9d6);display:flex;align-items:center;gap:10px;font-weight:800}
.streak .f{font-size:26px}
.streak small{display:block;color:var(--muted);font-weight:700}

/* level */
.lvlname{font-size:26px;font-weight:900;margin:16px 0 6px}
.bar{height:12px;border-radius:9px;background:rgba(255,255,255,.7);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--violet),#b28cff);transition:width .8s}
.planet{position:absolute;right:-6px;top:-6px;width:96px;height:96px}

/* subject card */
.subj-head{display:flex;align-items:center;gap:10px}
.subj-head .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px;font-weight:900;color:#fff}
.subj-head h3{font-size:22px;flex:1}
.go{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow);font-weight:900}
.subj-body{display:flex;gap:14px;margin-top:14px;align-items:stretch}
.subj-art{width:120px;flex:none;border-radius:18px;display:grid;place-items:center;font-size:54px;position:relative;overflow:hidden}
.topics{flex:1;display:flex;flex-direction:column;gap:6px;justify-content:center}
.topic{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;font-size:15px;padding:6px 0;border-bottom:1px dashed var(--line)}
.topic:last-child{border:0}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid #cfc8ea;flex:none;display:grid;place-items:center;font-size:12px;color:#fff}
.chk.on{border:0}
.subj-foot{margin-top:12px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.minibar{flex:1;height:8px;border-radius:6px;background:rgba(0,0,0,.06);margin-right:10px;overflow:hidden}
.minibar i{display:block;height:100%;border-radius:6px}
.math .ico,.math .chk.on,.math .minibar i{background:linear-gradient(135deg,var(--math),#4f7bff)}
.math .subj-art{background:linear-gradient(140deg,var(--math-bg),#cfe9ff)}
.zh .ico,.zh .chk.on,.zh .minibar i{background:linear-gradient(135deg,var(--zh),var(--zh2))}
.zh .subj-art{background:linear-gradient(140deg,var(--zh-bg),#ffe0cf)}
.en .ico,.en .chk.on,.en .minibar i{background:linear-gradient(135deg,var(--en),#4fd1c5)}
.en .subj-art{background:linear-gradient(140deg,var(--en-bg),#c9f3df)}

/* plan */
.plan{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(123,92,255,.06);font-weight:800;cursor:pointer}
.task .box{width:24px;height:24px;border-radius:8px;border:2px solid #c9c0f0;display:grid;place-items:center;flex:none;color:#fff;font-size:14px}
.task.done .box{background:var(--violet);border-color:var(--violet)}
.task.done .t{color:var(--muted);text-decoration:line-through}
.task .t{flex:1}
.task .xp{font-size:14px;color:#9a7b00;background:#fff4cf;padding:3px 9px;border-radius:999px;white-space:nowrap}

/* my star */
.starbox{display:flex;gap:10px;align-items:center;margin-top:8px}
.mystar{width:120px;height:120px;flex:none}
.mystar .glow{animation:pulse 2.6s ease-in-out infinite;transform-origin:60px 60px}
@keyframes pulse{50%{transform:scale(1.08);opacity:.8}}

/* collection */
.coll{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.badge{aspect-ratio:1;border-radius:14px;background:linear-gradient(140deg,#f3efff,#e8e2ff);display:grid;place-items:center;font-size:26px;position:relative}
.badge.lock{filter:grayscale(1);opacity:.35}

/* mini map card */
.c-map .preview{position:absolute;inset:0;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 35%);mask-image:linear-gradient(90deg,transparent 0,#000 35%)}
.c-map .over{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px;max-width:60%}
.c-map h3{font-size:22px}

/* game card */
.cat{position:absolute;right:16px;bottom:-6px;font-size:84px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.3))}

/* ===== screens ===== */
.screen-title{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.screen-title h1{font-size:30px;font-weight:900}
.back{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:20px;font-weight:900;display:grid;place-items:center}

/* map */
.mapwrap{position:relative;border-radius:28px;overflow:hidden;background:radial-gradient(800px 600px at 50% 50%,#2c2280 0,#140f3a 70%);height:calc(100vh - 140px);min-height:520px;box-shadow:var(--shadow);touch-action:none}
.mapwrap svg{width:100%;height:100%;display:block;cursor:grab}
.mapwrap svg:active{cursor:grabbing}
.mapctl{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:8px;z-index:2}
.mapctl button{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.14);color:#fff;font-size:22px;font-weight:900;backdrop-filter:blur(6px)}
.legend{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:6px;z-index:2}
.legend span{display:flex;align-items:center;gap:8px;color:#fff;font-weight:800;font-size:13px;background:rgba(255,255,255,.1);padding:6px 12px;border-radius:999px;backdrop-filter:blur(6px)}
.legend i{width:10px;height:10px;border-radius:50%}
.node{cursor:pointer}
.node .halo{opacity:0}
.node.done .halo{opacity:.3}
.node.cur .halo{opacity:.8;animation:halo 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes halo{50%{transform:scale(1.5);opacity:.2}}
.lit{stroke-dasharray:8 10;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
.panel{position:absolute;left:14px;right:14px;bottom:14px;z-index:3;background:rgba(255,255,255,.96);border-radius:22px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);transform:translateY(140%);transition:.3s}
.panel.on{transform:none}
.panel .pi{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:28px;flex:none;color:#fff}
.panel .pt{flex:1}
.panel .pt b{font-size:17px}
.panel .pt p{color:var(--muted);font-weight:700;font-size:14px}
.routes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.route{padding:16px}
.route .next{margin-top:8px;font-weight:800}

/* subject picker / iframe */
.frame{position:fixed;inset:0;z-index:50;background:#fff;display:flex;flex-direction:column}
.framebar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:linear-gradient(90deg,var(--night),var(--night2));color:#fff}
.framebar b{font-size:17px;flex:1}
.framebar button{padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-weight:800}
.frame iframe{flex:1;border:0;width:100%}

/* english */
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.unit{padding:18px}
.unit .ue{font-size:40px}
.unit h3{margin-top:6px}
.lessons{display:flex;gap:8px;margin-top:12px}
.lesson{flex:1;padding:10px 6px;border-radius:14px;background:var(--en-bg);font-weight:800;font-size:12.5px;text-align:center;line-height:1.25}
.lesson .s{display:block;font-size:14px;letter-spacing:1px;margin-top:3px;color:#f5a700}
.lesson.lock{opacity:.45;cursor:not-allowed;background:#f1f0f6}
.lesson:not(.lock):hover{background:#cff5e3}

/* quiz */
.quiz{max-width:720px;margin:0 auto}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.qbar{flex:1;height:14px;border-radius:9px;background:#e4e0f5;overflow:hidden}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--en),#4fd1c5);transition:width .4s}
.qcard{text-align:center;padding:28px 22px}
.qcard .ask{font-size:16px;color:var(--muted);font-weight:800}
.qcard .big{font-size:84px;line-height:1.1;margin:10px 0}
.qcard .word{font-size:40px;font-weight:900;margin:8px 0}
.say{display:inline-flex;align-items:center;gap:8px;margin:6px auto;padding:10px 18px;border-radius:999px;background:var(--en-bg);font-weight:900;color:#127a57}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.opt{padding:18px 12px;border-radius:18px;background:#fff;border:2px solid #e6e2f7;font-size:20px;font-weight:900;transition:.15s;min-height:66px}
.opt.emo{font-size:48px;padding:12px}
.opt:hover{border-color:var(--violet2);transform:translateY(-2px)}
.opt.ok{background:#dff8ec;border-color:var(--ok)}
.opt.bad{background:#ffe3e7;border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.letter{width:52px;height:56px;border-radius:14px;background:#fff;border:2px solid #e6e2f7;font-size:26px;font-weight:900}
.letter.used{opacity:.2;pointer-events:none}
.slots{display:flex;justify-content:center;gap:6px;margin-top:10px;min-height:60px}
.slot{width:44px;height:54px;border-bottom:4px solid #cfc8ea;font-size:30px;font-weight:900;display:grid;place-items:center}
.fc{display:flex;flex-direction:column;align-items:center}
.fc .ru{font-size:22px;color:var(--muted);font-weight:800}
.result{text-align:center;padding:34px 22px}
.result .stars{font-size:62px;letter-spacing:6px;margin:10px 0}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-250%);z-index:80;background:var(--night);color:#fff;padding:12px 20px;border-radius:999px;font-weight:800;transition:.35s;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.on{transform:translate(-50%,0)}

/* game */
.gamebox{position:relative;height:440px;border-radius:24px;background:radial-gradient(600px 400px at 50% 40%,#3a2b95,#140f3a);overflow:hidden;touch-action:manipulation}
.gstar{position:absolute;width:56px;height:56px;margin:-28px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:20px;color:var(--night);background:radial-gradient(circle,#fff 0,#ffe27a 60%,#ffbf2f 100%);box-shadow:0 0 18px rgba(255,220,120,.8);transition:.2s}
.gstar.hit{background:radial-gradient(circle,#fff,#9be7ff);box-shadow:0 0 26px #8fdcff;transform:scale(.8)}
.gstar.miss{animation:shake .3s}
.gamebox svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* onboarding */
.modal{position:fixed;inset:0;z-index:90;background:rgba(20,15,58,.6);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.modal .card{max-width:520px;width:100%;text-align:center;background:#fff;padding:28px}
.avas{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.avas button{font-size:40px;padding:10px;border-radius:18px;background:#f4f1ff;border:3px solid transparent}
.avas button.on{border-color:var(--violet);background:#ebe4ff}
.parents .card{margin-bottom:16px}
.parents p{margin-top:8px;line-height:1.5;font-weight:600}
.parents ul{margin:8px 0 0;padding-left:20px;line-height:1.6;font-weight:600}

/* bottom nav on phones */
.bnav{display:none}
@media (max-width:1100px){
  .c-hero{grid-column:span 12}.c-prog,.c-lvl{grid-column:span 6}
  .c-subj{grid-column:span 12}.c-plan{grid-column:span 7}.c-star{grid-column:span 5}
  .c-coll{grid-column:span 5}.c-map{grid-column:span 7}.c-game{grid-column:span 12}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding:16px 16px 100px}
  .bnav{display:flex;position:fixed;left:10px;right:10px;bottom:10px;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-radius:22px;box-shadow:0 10px 30px rgba(60,40,160,.2);padding:6px;justify-content:space-around}
  .bnav button{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:800;color:var(--muted);padding:6px 8px;border-radius:14px}
  .bnav button .ic{font-size:22px}
  .bnav button.on{color:var(--violet);background:#f1ecff}
  .grid{gap:14px}
  .c-prog,.c-lvl,.c-plan,.c-star,.c-coll,.c-map{grid-column:span 12}
  .hello h1{font-size:23px}.ava{width:54px;height:54px;font-size:30px}
  .top .pill{display:none}
  .c-hero{min-height:300px}
  .slide>:not(.hero-art){max-width:100%}
  .slide h2{font-size:28px}
  .hero-art{opacity:.35;width:70%}
  .routes{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr 1fr}
  .qcard .big{font-size:64px}
  .letter{width:44px;height:50px;font-size:22px}
  .slot{width:34px}
  .mapwrap{height:calc(100vh - 200px)}
  .screen-title h1{font-size:24px}
  .panel{padding:12px;gap:10px}.panel .pi{width:44px;height:44px;font-size:22px}.panel .pt b{font-size:15px}.panel .pt p{font-size:13px}.panel .btn{padding:10px 14px}
}

/* ===================================================================
   Жидкое стекло и внутреннее свечение
   Стекло: полупрозрачная заливка + размытие фона + светлая кромка сверху
   + блик. Свечение: внутренние тени (inset) цвета предмета/ночи.
   Всё на CSS, без картинок и скриптов, чтобы на телефоне было быстро.
   =================================================================== */
:root{
  --glass:linear-gradient(160deg,rgba(255,255,255,.80) 0%,rgba(255,255,255,.58) 55%,rgba(246,242,255,.62) 100%);
  --glass-sheen:radial-gradient(120% 70% at 0% 0%,rgba(255,255,255,.95) 0,rgba(255,255,255,0) 52%);
  --glass-rim:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.55),inset 0 -1px 0 rgba(123,92,255,.10);
  --glass-glow:inset 0 0 28px rgba(255,255,255,.55),inset 0 -26px 44px -30px rgba(123,92,255,.30);
  --night-glow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 1px rgba(255,255,255,.07),inset 0 0 70px rgba(150,120,255,.32),inset 0 -50px 90px -50px rgba(110,200,255,.40);
  --blur:blur(18px) saturate(170%);
}

/* цветные «туманности» за стеклом: стеклу нужно, что преломлять */
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(38% 30% at 82% 72%,rgba(255,170,200,.30),transparent 70%),
    radial-gradient(34% 28% at 12% 78%,rgba(130,230,200,.26),transparent 70%),
    radial-gradient(40% 32% at 55% 35%,rgba(170,150,255,.22),transparent 70%)}

/* --- светлые карточки --- */
.card{background:var(--glass-sheen),var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid rgba(255,255,255,.75);box-shadow:var(--shadow),var(--glass-rim),var(--glass-glow)}
.c-subj:hover{box-shadow:0 18px 40px rgba(60,40,160,.16),var(--glass-rim),var(--glass-glow)}
.c-subj.math{box-shadow:var(--shadow),var(--glass-rim),inset 0 0 28px rgba(255,255,255,.55),inset 0 -30px 50px -32px rgba(47,164,255,.45)}
.c-subj.zh{box-shadow:var(--shadow),var(--glass-rim),inset 0 0 28px rgba(255,255,255,.55),inset 0 -30px 50px -32px rgba(255,106,91,.40)}
.c-subj.en{box-shadow:var(--shadow),var(--glass-rim),inset 0 0 28px rgba(255,255,255,.55),inset 0 -30px 50px -32px rgba(34,192,138,.42)}
.c-lvl{background:var(--glass-sheen),radial-gradient(90% 80% at 100% 0%,rgba(190,160,255,.55),transparent 60%),linear-gradient(160deg,rgba(240,234,255,.85),rgba(214,200,255,.75));
  box-shadow:var(--shadow),var(--glass-rim),inset 0 0 40px rgba(255,255,255,.6),inset 0 -36px 60px -34px rgba(123,92,255,.55)}

/* --- тёмные «ночные» карточки: свечение изнутри --- */
.c-hero{background:radial-gradient(55% 75% at 82% 50%,rgba(110,170,255,.38),transparent 65%),radial-gradient(60% 60% at 0% 100%,rgba(170,110,255,.30),transparent 70%),linear-gradient(135deg,var(--night) 0%,var(--night2) 60%,#4a2fa8 100%);box-shadow:var(--shadow),var(--night-glow)}
.c-star{background:radial-gradient(55% 55% at 30% 55%,rgba(255,214,110,.30),transparent 70%),linear-gradient(160deg,#241a5e,#3b2a8f);box-shadow:var(--shadow),var(--night-glow)}
.c-map{background:radial-gradient(50% 70% at 75% 60%,rgba(120,150,255,.30),transparent 70%),linear-gradient(160deg,var(--night),#2a1f6b);box-shadow:var(--shadow),var(--night-glow)}
.c-game{background:radial-gradient(45% 70% at 88% 85%,rgba(255,170,240,.32),transparent 70%),linear-gradient(135deg,#2b2378,#5b3cc4);box-shadow:var(--shadow),var(--night-glow)}
.c-hero,.c-star,.c-map,.c-game,.c-lvl{border:0}
.cat{filter:drop-shadow(0 8px 18px rgba(0,0,0,.3)) drop-shadow(0 0 22px rgba(255,190,255,.45))}

/* --- картинки предметов: светятся изнутри --- */
.subj-art{box-shadow:inset 0 2px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.7),inset 0 0 26px rgba(255,255,255,.75)}
.math .subj-art{background:radial-gradient(60% 55% at 50% 45%,#fff 0,rgba(255,255,255,0) 70%),linear-gradient(140deg,var(--math-bg),#bfe2ff);box-shadow:inset 0 2px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.7),inset 0 -18px 30px -12px rgba(47,164,255,.45)}
.zh .subj-art{background:radial-gradient(60% 55% at 50% 45%,#fff 0,rgba(255,255,255,0) 70%),linear-gradient(140deg,var(--zh-bg),#ffd6c2);box-shadow:inset 0 2px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.7),inset 0 -18px 30px -12px rgba(255,106,91,.40)}
.en .subj-art{background:radial-gradient(60% 55% at 50% 45%,#fff 0,rgba(255,255,255,0) 70%),linear-gradient(140deg,var(--en-bg),#bff0d8);box-shadow:inset 0 2px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.7),inset 0 -18px 30px -12px rgba(34,192,138,.45)}
.math .subj-art{text-shadow:0 8px 22px rgba(47,164,255,.45)}
.zh .subj-art{text-shadow:0 8px 22px rgba(255,106,91,.45)}
.en .subj-art{text-shadow:0 8px 22px rgba(34,192,138,.45)}

/* иконки предметов и логотип — «леденцы» */
.subj-head .ico,.logo,.panel .pi{box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -6px 12px rgba(0,0,0,.14),inset 0 0 12px rgba(255,255,255,.25),0 6px 16px rgba(80,60,200,.25)}

/* --- кнопки: жидкое стекло --- */
.btn{position:relative;overflow:hidden;isolation:isolate;
  background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(238,233,255,.92));
  box-shadow:0 8px 22px rgba(40,20,120,.22),inset 0 1px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.6),inset 0 -4px 10px rgba(123,92,255,.20)}

  background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0))}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;z-index:-1;pointer-events:none;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);transition:left .6s ease}
.btn:hover::after{left:120%}
.btn.v{background:linear-gradient(180deg,#9c84ff,#6a4af2);color:#fff;
  box-shadow:0 10px 24px rgba(110,80,255,.42),inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 0 1px rgba(255,255,255,.18),inset 0 -6px 14px rgba(40,10,140,.35),inset 0 0 18px rgba(210,190,255,.45)}

.btn.ghost{background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.18),inset 0 0 16px rgba(255,255,255,.10)}
.btn.ghost::before{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0))}

/* круглые и «таблеточные» элементы */
.pill,.go,.back{background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(244,240,255,.75));-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);

.mapctl button,.legend span,.framebar button{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.12),inset 0 0 14px rgba(255,255,255,.08)}

.nav button.on{background:linear-gradient(180deg,#fff,rgba(244,240,255,.85));box-shadow:var(--shadow),inset 0 1px 0 #fff,inset 0 -4px 10px rgba(123,92,255,.16)}

/* --- строки, значки, полоски --- */
.task{background:linear-gradient(180deg,rgba(255,255,255,.70),rgba(240,235,255,.55));box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.5),inset 0 -8px 16px -10px rgba(123,92,255,.25)}

.en .chk.on{box-shadow:0 0 10px rgba(34,192,138,.5),inset 0 1px 0 rgba(255,255,255,.55)}

/* --- карта, игра, окна --- */
.mapwrap{box-shadow:var(--shadow),inset 0 0 120px rgba(130,100,255,.38),inset 0 1px 0 rgba(255,255,255,.2)}
.gamebox{box-shadow:inset 0 0 100px rgba(150,120,255,.35),inset 0 1px 0 rgba(255,255,255,.2)}

@media (max-width:760px){

// поэтому карта видит прогресс по математике и китайскому без серверов.
const MATH_URL='../olympiad-math-trainer/';

/* ====================== хранилище ====================== */
const S={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},

let en=S.get(EN_KEY,{units:{},xp:0,days:{}});
const saveHub=()=>S.set(HUB_KEY,hub), saveEn=()=>S.set(EN_KEY,en);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const m=n%10;return n>10&&n<20?c:m>1&&m<5?b:m===1?a:c};

/* ====================== чтение прогресса тренажёров ====================== */
function readMath(){
  let key='ol5progress_guest';
  try{const a=S.get('ol5account',null);if(a&&a.id)key='ol5progress_'+a.id}catch(e){}
  const p=S.get(key,{})||{};
  const days={};const d30=(p.v30&&p.v30.days)||{};
  for(const k in d30){const x=d30[k]||{};days[k]=(x.ind||0)+(x.ast||0)}
  const topics=Object.keys(p.byTopic||{}).filter(t=>(p.byTopic[t].correct||0)>0).length;
  return {xp:p.xp||0,solved:p.correct||0,total:p.total||0,topics,days};
}
function readZh(){
  const s=S.get('hanzi-hero-v1',{})||{};
  const words=Object.values(s.words||{}).filter(w=>w&&(w.box||0)>=1).length;
  const days={};for(const k in (s.days||{})){const x=s.days[k]||{};days[k]=(x.correct||0)}
  return {xp:s.xp||0,words,days,streak:s.streak||0};
}
function enStats(){
  let lessons=0,stars=0,unitsDone=0,perfect=0;
  for(const u of UNITS){const r=en.units[u.id]||[];let all=true;
    for(let i=0;i<3;i++){if(r[i]){lessons++;stars+=r[i];if(r[i]===3)perfect++}else all=false}
    if(all)unitsDone++}
  const days={};for(const k in en.days)days[k]=en.days[k].lessons||0;
  return {xp:en.xp||0,lessons,stars,unitsDone,perfect,days};
}

const MATH_STEPS=[1,5,10,20,35,50,75,100,150,200,300,500];
const ZH_STEPS=[1,5,10,20,30,45,60,80,100,130,160,200];
function routeNodes(x){
  const mk=(vals,cur,label)=>{let firstOpen=-1;return vals.map((v,i)=>{const done=cur>=v;if(!done&&firstOpen<0)firstOpen=i;
    return {v,done,cur:!done&&firstOpen===i,label:label(v),left:Math.max(0,v-cur)}})};
  const math=mk(MATH_STEPS,x.m.solved,v=>v+' '+plural(v,'задача','задачи','задач'));
  const zh=mk(ZH_STEPS,x.z.words,v=>v+' '+plural(v,'слово','слова','слов'));
  let open=-1;const eng=UNITS.map((u,i)=>{const r=en.units[u.id]||[];const done=r.filter(Boolean).length===3;
    if(!done&&open<0)open=i;return {u,done,cur:!done&&open===i,stars:r.reduce((a,b)=>a+(b||0),0),label:u.ru}});
  return {math,zh,eng};
}

 {k:'math',name:'Планета Чисел',color:'#4fb6ff',glow:'#9bdcff',icon:'∑',base:-Math.PI/2},

// Узлы ставим вдоль спирали на равном расстоянии друг от друга (по длине дуги).
const SPIRAL=(()=>{const N=600,T=2.05,r0=165,r1=700;const pts=[[0,r0,0]];let L=0;
  for(let j=1;j<=N;j++){const th=T*j/N,r=r0+(r1-r0)*j/N,pth=T*(j-1)/N,pr=r0+(r1-r0)*(j-1)/N;
    L+=Math.hypot(r*Math.cos(th)-pr*Math.cos(pth),r*Math.sin(th)-pr*Math.sin(pth));pts.push([th,r,L])}return pts})();
function armPos(arm,i,n){const total=SPIRAL[SPIRAL.length-1][2];const want=Math.min(1,i/(n-1+1.1))*total;
  let j=0;while(j<SPIRAL.length-1&&SPIRAL[j][2]<want)j++;const [th,r]=SPIRAL[j];const a=arm.base+0.2+th;return [500+r*Math.cos(a),500+r*Math.sin(a)]}
// Точка спирали рукава по доле t (t>1 — продолжение спирали за планету, там тоже «местность»)
function armAt(arm,t){const th=2.05*t,r=165+535*t,a=arm.base+0.2+th;return [500+r*Math.cos(a),500+r*Math.sin(a)]}

function mapSVG(x,{mini=false}={}){

    const all=[[500,500],...geo[arm.k].pts];for(let i=1;i<all.length;i++){for(let u=0;u<1;u+=.25){busy.push([all[i-1][0]+(all[i][0]-all[i-1][0])*u,all[i-1][1]+(all[i][1]-all[i-1][1])*u,mini?60:95])}}

    nodes.forEach((nd,i)=>{const [cx,cy]=pts[i];const st=nd.done?'done':nd.cur?'cur':'lock';

        ${(!mini&&arm.k==='eng'&&nd.stars)?`<text x="${cx}" y="${cy-r-10}" text-anchor="middle" font-size="18" fill="#ffd66b">${'★'.repeat(Math.min(3,Math.ceil(nd.stars/3)))}</text>`:''}

          const pv=i?pts[i-1]:[500,500],nx=pts[i+1]||geo[arm.k].end;let tx=nx[0]-pv[0],ty=nx[1]-pv[1];const tl=Math.hypot(tx,ty)||1;let px=-ty/tl,py=tx/tl;
          if(px*ux+py*uy<0){px=-px;py=-py}return pill(cx+px*(r+70),cy+py*(r+34)+6,'цель · ещё '+nd.left,22,arm.glow,'#1b1446')})():''}

function pill(cx,cy,t,fs,bg,fg,stroke){const w=String(t).length*fs*.6+fs*1.3,h=fs*1.7;
  return `<g><rect x="${(cx-w/2).toFixed(1)}" y="${(cy-h/2-fs*.32).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${(h/2).toFixed(1)}" fill="${bg}"${stroke?` stroke="${stroke}" stroke-width="2"`:''}/><text x="${cx.toFixed(1)}" y="${(cy+fs*.02).toFixed(1)}" text-anchor="middle" font-size="${fs}" font-weight="900" fill="${fg}">${esc(t)}</text></g>`}
function starPath(cx,cy,R,r){let d='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5;const rad=i%2?r:R;d+=(i?'L':'M')+(cx+rad*Math.cos(a)).toFixed(1)+' '+(cy+rad*Math.sin(a)).toFixed(1)}return d+'Z'}

function renderMap(M){

    ${routeCard('zh','Китайский','中',nz?`Следующая звезда: <b>${nz.label}</b> — осталось ${nz.left}`:'Все звёзды зажжены!')}
    ${routeCard('en','Английский','Aa',ne?`Следующая звезда: тема <b>${ne.u.ru}</b>`:'Все звёзды зажжены!')}
  </div>`;
  M.querySelectorAll('[data-subj]').forEach(el=>el.addEventListener('click',()=>openSubject(el.dataset.subj)));
  // pan & zoom
  const svg=M.querySelector('#mapsvg');let vb=[-280,-280,1560,1560];
  const fit=()=>{const r=svg.getBoundingClientRect();const asp=r.width/r.height;if(asp>1){const w=1560*asp;vb=[500-w/2,-280,w,1560]}else{const h=1560/asp;vb=[-280,500-h/2,1560,h]}apply()};
  const apply=()=>svg.setAttribute('viewBox',vb.map(v=>v.toFixed(1)).join(' '));
  const zoom=(k,cx,cy)=>{const nw=Math.min(3200,Math.max(300,vb[2]*k));const f=nw/vb[2];if(cx==null){cx=vb[0]+vb[2]/2;cy=vb[1]+vb[3]/2}
    vb=[cx-(cx-vb[0])*f,cy-(cy-vb[1])*f,vb[2]*f,vb[3]*f];apply()};
  fit();if(svg.getBoundingClientRect().width<600)zoom(.6);
  M.querySelector('#zin').onclick=()=>zoom(.75);M.querySelector('#zout').onclick=()=>zoom(1.33);M.querySelector('#zfit').onclick=fit;
  const toSvg=(ex,ey)=>{const r=svg.getBoundingClientRect();return [vb[0]+(ex-r.left)/r.width*vb[2],vb[1]+(ey-r.top)/r.height*vb[3]]};
  svg.addEventListener('wheel',e=>{e.preventDefault();const [cx,cy]=toSvg(e.clientX,e.clientY);zoom(e.deltaY>0?1.12:.89,cx,cy)},{passive:false});
  const pts=new Map();let moved=0,pinch0=null;
  svg.addEventListener('pointerdown',e=>{pts.set(e.pointerId,[e.clientX,e.clientY]);moved=0;svg.setPointerCapture&&svg.setPointerCapture(e.pointerId)});
  svg.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const prev=pts.get(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
    const r=svg.getBoundingClientRect();
    if(pts.size===1){const dx=(e.clientX-prev[0])/r.width*vb[2],dy=(e.clientY-prev[1])/r.height*vb[3];moved+=Math.abs(e.clientX-prev[0])+Math.abs(e.clientY-prev[1]);vb[0]-=dx;vb[1]-=dy;apply()}
    else if(pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);moved+=10;if(pinch0){const [cx,cy]=toSvg((a[0]+b[0])/2,(a[1]+b[1])/2);zoom(pinch0/d,cx,cy)}pinch0=d}});
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch0=null};
  svg.addEventListener('pointerup',e=>{const wasMoved=moved>6;up(e);if(wasMoved)return;
    const el=document.elementFromPoint(e.clientX,e.clientY);const g=el&&el.closest&&el.closest('.node');if(g)nodeInfo(g.dataset.arm,g.dataset.i,x,R)});
  svg.addEventListener('pointercancel',up);
  window.onresize=()=>{if(route==='map')fit()};
}
function routeCard(k,name,ic,txt){return `<div class="card route c-subj ${k}" data-subj="${k}" style="grid-column:auto"><div class="subj-head"><div class="ico">${ic}</div><h3>${name}</h3><div class="go">›</div></div><p class="next muted">${txt}</p></div>`}
function nodeInfo(arm,i,x,R){

  if(i==='planet'){ic=A.icon;t=A.name;d='Пройди все звёзды на этом пути, чтобы долететь до планеты.'}
  else{const nd=R[arm][+i];ic=nd.done?'⭐':nd.cur?'✨':'🔒';

  btn=`<button class="btn v" id="pgo">Заниматься</button>`;

  P.classList.add('on');P.querySelector('#pgo').onclick=()=>openSubject(k);
}

let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en[-_]GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=voice?voice.lang:'en-GB';if(voice)u.voice=voice;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function renderEnglish(M){
  const x=enStats();
  M.innerHTML=`<div class="screen-title"><button class="back" data-go="subjects">←</button><h1>Английский 🦁</h1></div>
  <p class="muted" style="margin-bottom:16px">Пройдено уроков: ${x.lessons} из ${UNITS.length*3} · звёзд ${x.stars}. Каждая тема — звезда на Планете Слов.</p>
  <div class="units">${UNITS.map((u,ui)=>{const r=en.units[u.id]||[];const prevDone=ui===0||(en.units[UNITS[ui-1].id]||[]).filter(Boolean).length>=1;
    return `<div class="card unit en"><div class="ue">${u.e}</div><h3>${u.ru}</h3><p class="muted" style="font-size:13px">${u.w.slice(0,4).map(w=>w[0]).join(', ')}…</p>
    <div class="lessons">${LESSONS.map((l,i)=>{const open=prevDone&&(i===0||r[i-1]);return `<button class="lesson ${open?'':'lock'}" ${open?`data-les="${ui}:${i}"`:''}>${open?'':'🔒 '}${l}<span class="s">${r[i]?'★'.repeat(r[i])+'☆'.repeat(3-r[i]):'☆☆☆'}</span></button>`}).join('')}</div></div>`}).join('')}</div>`;
  M.querySelectorAll('[data-les]').forEach(b=>b.onclick=()=>{const [u,l]=b.dataset.les.split(':').map(Number);startLesson(M,u,l)});
}
function makeQuestions(u,l){
  const W=u.w,qs=[];const others=w=>shuffle(W.filter(o=>o!==w));
  const opts=(w,n=4)=>shuffle([w,...others(w).slice(0,n-1)]);
  const pool=shuffle(W);
  if(l===0){pool.forEach(w=>qs.push({type:'card',w}));shuffle(W).slice(0,6).forEach((w,i)=>qs.push(i%2?{type:'pic2word',w,o:opts(w)}:{type:'hear2pic',w,o:opts(w)}))}
  else if(l===1){const kinds=['hear2pic','pic2word','word2ru','hear2word'];pool.forEach((w,i)=>qs.push({type:kinds[i%4],w,o:opts(w)}));shuffle(W).slice(0,2).forEach(w=>qs.push({type:'pic2word',w,o:opts(w)}))}
  else{const p=pool;qs.push({type:'spell',w:p[0]},{type:'spell',w:p[1]},{type:'spell',w:p[2]});
    [p[3],p[4],p[5]].forEach(w=>qs.push({type:'phrase',w,o:opts(w)}));qs.push({type:'ru2word',w:p[6],o:opts(p[6])},{type:'hear2pic',w:p[7],o:opts(p[7])});
    return shuffle(qs)}
  return qs;
}
function startLesson(M,ui,l){
  const u=UNITS[ui];const qs=makeQuestions(u,l);let i=0,mistakes=0,correct=0,locked=false;
  const scored=qs.filter(q=>q.type!=='card').length;
  const next=()=>{i++;locked=false;i<qs.length?draw():finish()};
  const answer=(btn,ok,w)=>{if(locked)return;if(ok){locked=true;btn.classList.add('ok');correct++;say(w[0]);setTimeout(next,850)}else{btn.classList.add('bad');mistakes++;setTimeout(()=>btn.classList.remove('bad'),400)}};
  function draw(){const q=qs[i];const w=q.w;let body='';
    const optBtns=(kind)=>`<div class="opts">${q.o.map((o,j)=>`<button class="opt ${kind==='emo'?'emo':''}" data-o="${j}">${kind==='emo'?o[1]:kind==='ru'?o[2]:esc(o[0])}</button>`).join('')}</div>`;
    const sayBtn=`<button class="say" id="sayb">🔊 Послушать</button>`;
    switch(q.type){
      case 'card':body=`<div class="fc"><div class="ask">Новое слово</div><div class="big">${w[1]}</div><div class="word">${esc(w[0])}</div><div class="ru">${w[2]}</div>${sayBtn}<button class="btn v" id="nextb" style="margin:18px auto 0">Дальше →</button></div>`;break;
      case 'hear2pic':body=`<div class="ask">Послушай и выбери картинку</div><div class="big">🎧</div>${sayBtn}${optBtns('emo')}`;break;
      case 'hear2word':body=`<div class="ask">Послушай и выбери слово</div><div class="big">🎧</div>${sayBtn}${optBtns('en')}`;break;
      case 'pic2word':body=`<div class="ask">Как это по-английски?</div><div class="big">${w[1]}</div>${optBtns('en')}`;break;
      case 'word2ru':body=`<div class="ask">Что значит это слово?</div><div class="word">${esc(w[0])}</div>${sayBtn}${optBtns('ru')}`;break;
      case 'ru2word':body=`<div class="ask">Переведи на английский</div><div class="word">${w[2]}</div>${optBtns('en')}`;break;
      case 'phrase':{const [en1,ru1]=u.tpl;body=`<div class="ask">Вставь слово во фразу · <span style="font-weight:700">${ru1}</span></div><div class="big">${w[1]}</div><div class="word" style="font-size:30px">${esc(en1).replace('___','<span style="color:var(--en)">____</span>')}</div>${optBtns('en')}`;break}
      case 'spell':{const letters=shuffle([...w[0].toLowerCase().replace(/[^a-z]/g,'')]);body=`<div class="ask">Собери слово из букв · ${w[2]}</div><div class="big">${w[1]}</div>${sayBtn}<div class="slots" id="slots">${letters.map(()=>'<div class="slot"></div>').join('')}</div><div class="letters">${letters.map((c,j)=>`<button class="letter" data-l="${j}">${c}</button>`).join('')}</div><button class="say" id="undo" style="margin-top:14px">⌫ Стереть</button>`;q.letters=letters;break}
    }
    M.innerHTML=`<div class="quiz"><div class="qtop"><button class="back" id="qx">✕</button><div class="qbar"><i style="width:${i/qs.length*100}%"></i></div><b>${u.e}</b></div><div class="card qcard">${body}</div></div>`;
    M.querySelector('#qx').onclick=()=>renderEnglish(M);
    const sb=M.querySelector('#sayb');if(sb)sb.onclick=()=>say(q.type==='phrase'?u.tpl[0].replace('___',w[0]):w[0]);
    if(['card','hear2pic','hear2word','word2ru'].includes(q.type))setTimeout(()=>say(w[0]),250);
    if(q.type==='card')M.querySelector('#nextb').onclick=next;
    M.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>answer(b,q.o[+b.dataset.o]===w,w));
    if(q.type==='spell'){const target=w[0].toLowerCase().replace(/[^a-z]/g,'');let typed=[];const slots=[...M.querySelectorAll('.slot')];
      const upd=()=>slots.forEach((s,j)=>s.textContent=typed[j]!=null?q.letters[typed[j]]:'');
      M.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{if(locked)return;typed.push(+b.dataset.l);b.classList.add('used');upd();
        if(typed.length===target.length){const got=typed.map(j=>q.letters[j]).join('');
          if(got===target){locked=true;correct++;slots.forEach(s=>s.style.borderColor='var(--ok)');say(w[0]);setTimeout(next,900)}
          else{mistakes++;M.querySelector('#slots').animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:300});
            setTimeout(()=>{typed=[];M.querySelectorAll('.letter').forEach(x=>x.classList.remove('used'));upd()},450)}}});
      M.querySelector('#undo').onclick=()=>{const j=typed.pop();if(j!=null)M.querySelector(`[data-l="${j}"]`).classList.remove('used');upd()}}
  }
  function finish(){
    const stars=mistakes===0?3:mistakes<=2?2:1;const r=en.units[u.id]||[0,0,0];const prev=r[l]||0;r[l]=Math.max(prev,stars);en.units[u.id]=r;
    const gain=correct*5+(stars===3?20:stars===2?10:5);en.xp=(en.xp||0)+gain;const t=today();en.days[t]=en.days[t]||{lessons:0,correct:0};en.days[t].lessons++;en.days[t].correct+=correct;saveEn();
    M.innerHTML=`<div class="quiz"><div class="card result"><div class="ask muted">${u.ru} · ${LESSONS[l]}</div><div class="stars">${'⭐'.repeat(stars)}${'<span style="opacity:.2">⭐</span>'.repeat(3-stars)}</div>
      <h2 style="font-size:28px;font-weight:900">${stars===3?'Блестяще!':stars===2?'Отлично!':'Хорошо, идём дальше!'}</h2>
      <p class="muted" style="margin-top:8px">Верно: ${correct} из ${scored} · ошибок: ${mistakes} · +${gain} ⭐</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px"><button class="btn v" id="again">Ещё раз</button><button class="btn" id="tolist">К темам</button><button class="btn" data-go="map">🗺️ На карту</button></div></div></div>`;
    M.querySelector('#again').onclick=()=>startLesson(M,ui,l);M.querySelector('#tolist').onclick=()=>renderEnglish(M);celebrateIfGrew();
  }
  draw();
}

function renderGame(M){
  M.innerHTML=`<div class="screen-title"><button class="back" data-go="home">←</button><h1>Собери созвездие</h1></div>
  <div class="card" style="margin-bottom:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap"><b style="flex:1;min-width:220px">Нажимай на звёзды по порядку от 1 до 9. Ошибка добавляет 2 секунды.</b><span class="pill">⏱ <span id="gt">0.0</span> с</span><span class="pill">🏆 ${hub.game.best!=null?hub.game.best.toFixed(1)+' с':'—'}</span><button class="btn v" id="gs">Старт</button></div>
  <div class="gamebox" id="gb"><svg id="gl"></svg></div>`;
  const gb=M.querySelector('#gb'),gl=M.querySelector('#gl');let t0=0,timer=null,need=1,pen=0,pts=[];
  const start=()=>{gb.querySelectorAll('.gstar').forEach(s=>s.remove());gl.innerHTML='';need=1;pen=0;pts=[];
    const W=gb.clientWidth,H=gb.clientHeight;const placed=[];
    for(let n=1;n<=9;n++){let x,y,tries=0;do{x=40+Math.random()*(W-80);y=40+Math.random()*(H-80);tries++}while(placed.some(p=>Math.hypot(p[0]-x,p[1]-y)<80)&&tries<200);placed.push([x,y]);
      const s=document.createElement('button');s.className='gstar';s.textContent=n;s.style.left=x+'px';s.style.top=y+'px';s.onclick=()=>tap(s,n,x,y);gb.appendChild(s)}
    t0=performance.now();clearInterval(timer);timer=setInterval(()=>{const el=M.querySelector('#gt');if(!el)return clearInterval(timer);el.textContent=((performance.now()-t0)/1000+pen).toFixed(1)},100)};
  const tap=(s,n,x,y)=>{if(n!==need){pen+=2;s.classList.add('miss');setTimeout(()=>s.classList.remove('miss'),300);return}
    s.classList.add('hit');pts.push([x,y]);if(pts.length>1){const a=pts[pts.length-2];gl.innerHTML+=`<line x1="${a[0]}" y1="${a[1]}" x2="${x}" y2="${y}" stroke="#9be7ff" stroke-width="3" stroke-linecap="round" opacity=".8"/>`}
    need++;if(need>9){clearInterval(timer);const sec=(performance.now()-t0)/1000+pen;const best=hub.game.best==null||sec<hub.game.best;if(best)hub.game.best=sec;
      const t=today();hub.game.plays=hub.game.plays||{};hub.game.plays[t]=(hub.game.plays[t]||0)+1;if(hub.game.plays[t]<=3)hub.xp=(hub.xp||0)+5;saveHub();
      toast((best?'Новый рекорд! ':'Готово! ')+sec.toFixed(1)+' с'+(hub.game.plays[t]<=3?' · +5 ⭐':''));celebrateIfGrew();setTimeout(()=>renderGame(M),1600)}};
  M.querySelector('#gs').onclick=start;
}

/* ====================== старт ====================== */
const ROUTES=['home','map','subjects','collection','game','parents','english'];
function onboarding(){
  if(hub.avatar)return;
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="card"><div style="font-size:54px">🌌</div><h2 style="font-size:28px;font-weight:900;margin-top:6px">Добро пожаловать в ${BRAND}!</h2>
   <p class="muted" style="margin-top:8px">Выбери героя, который полетит с тобой по звёздной карте.</p>
   <div class="avas">${AVAS.slice(0,8).map(a=>`<button data-a="${a}">${a}</button>`).join('')}</div><button class="btn v" id="okA" style="margin:0 auto">Полетели! 🚀</button></div>`;
  document.body.appendChild(m);let pick='🦊';
  m.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{pick=b.dataset.a;m.querySelectorAll('[data-a]').forEach(x=>x.classList.toggle('on',x===b))});
  m.querySelector('[data-a]').classList.add('on');
  m.querySelector('#okA').onclick=()=>{hub.avatar=pick;saveHub();m.remove();go(route)};
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==route&&ROUTES.includes(h))go(h)});
window.addEventListener('storage',()=>{if(['home','map'].includes(route))go(route)});
const start=(location.hash||'').slice(1);go(ROUTES.includes(start)?start:'home');
onboarding();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
